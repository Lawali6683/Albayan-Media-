<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albayan Media - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #00f2fe;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --card-bg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', 'Segoe UI', sans-serif; }
        body { background: var(--dark); color: white; padding-top: 70px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

      
        
        .notif-container {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.95);
            color: #1e293b; padding: 15px; border-radius: 12px; z-index: 10000;
            display: flex; align-items: center; gap: 12px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-left: 5px solid var(--primary);
        }
        .notif-container.active { top: 20px; }
        .notif-container i { font-size: 20px; color: var(--primary); }

        
        header {
            position: fixed; top: 0; width: 100%; height: 65px;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--glass);
        }
        .header-logo { height: 38px; width: auto; object-fit: contain; }
        .icon-btn { font-size: 22px; cursor: pointer; color: var(--primary); transition: 0.3s; }

      
        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); visibility: hidden; opacity: 0;
            transition: 0.3s; z-index: 2000; backdrop-filter: blur(5px);
        }
        .menu-overlay.active { visibility: visible; opacity: 1; }
        #side-menu {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--dark); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2001; padding: 25px; border-right: 1px solid var(--glass);
        }
        #side-menu.active { left: 0; }
        .close-menu { float: right; font-size: 24px; color: #f87171; cursor: pointer; }
        .menu-list { list-style: none; margin-top: 60px; }
        .menu-list li { margin: 10px 0; border-radius: 10px; overflow: hidden; }
        .menu-list li a { 
            color: white; text-decoration: none; padding: 15px; display: flex; 
            align-items: center; gap: 15px; background: var(--glass); transition: 0.3s;
        }
        .menu-list li a:active { background: var(--primary); color: #000; }

        
        .info-card {
            background: var(--glass); margin: 10px 15px; padding: 12px 18px;
            border-radius: 15px; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid var(--glass);
        }
        .user-meta { display: flex; align-items: center; gap: 10px; }
        .user-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        
        .status-strip { display: flex; gap: 8px; padding: 0 15px; overflow-x: auto; margin-bottom: 15px; scrollbar-width: none; }
        .status-strip::-webkit-scrollbar { display: none; }
        .stat-tag { 
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; 
            white-space: nowrap; background: #1e293b; border: 1px solid var(--glass);
        }
        .on { color: #4ade80; } .off { color: #f87171; }

       
        .post-card {
            background: var(--card-bg); margin: 15px; border-radius: 18px; 
            overflow: hidden; border: 1px solid var(--glass); position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .new-badge {
            position: absolute; top: 12px; left: 12px; background: var(--primary);
            color: black; padding: 3px 10px; border-radius: 6px; font-weight: 800; font-size: 10px; z-index: 10;
        }
        .post-media { width: 100%; display: block; background: #000; }
        .post-body { padding: 18px; }
        .post-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .post-desc { font-size: 14px; color: #cbd5e1; line-height: 1.6; }

       
        .post-actions { display: flex; border-top: 1px solid var(--glass); }
        .action-btn { 
            flex: 1; padding: 15px; display: flex; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; color: #94a3b8;
        }
        .action-btn:active { background: var(--glass); color: var(--primary); }

      
        .progress-box { height: 4px; background: #0f172a; width: 100%; display: none; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: 0.1s; }

       
        .remain-float {
            position: fixed; bottom: 20px; left: 20px; width: 55px; height: 55px;
            background: var(--primary); border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,210,255,0.4);
            z-index: 1000; border: 3px solid var(--dark);
        }
        .remain-float b { font-size: 16px; color: #000; }
        .remain-float span { font-size: 8px; color: #000; font-weight: bold; }

       
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: none; align-items: center; justify-content: center;
        }
        .modal img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 30px; color: white; }

       
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 11000; display: flex; align-items: center; justify-content: center;
        }
        
        
        
        
.status-strip { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    padding: 0 15px; 
    margin-bottom: 15px;
    justify-content: flex-start; 
}


.remain-tag {
    margin-left: auto; 
    background: var(--primary);
    color: #000;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    gap: 4px;
    align-items: center;
}


.read-more-btn {
    color: var(--primary);
    cursor: pointer;
    font-weight: bold;
    margin-left: 5px;
    display: inline-block;
}


.remain-float { display: none; }

.stat-tag { cursor: pointer; transition: 0.3s; padding: 5px 10px; border-radius: 8px; background: #2d2d44; margin-right: 5px; }
.stat-tag:hover { background: #3e3e5e; }
.stat-tag span.on { color: #4ade80; font-weight: bold; }
.stat-tag span.off { color: #f87171; font-weight: bold; }


#notif-permission-card {
    display: none; background: #1e293b; padding: 15px; border-radius: 12px;
    margin: 10px; border-left: 5px solid var(--primary); color: white;
}
.btn-allow { background: #4ade80; color: #000; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }

    </style>
</head>
<body>

    <div id="loader"><i class="fas fa-circle-notch fa-spin fa-2x" style="color:var(--primary)"></i></div>

    <div id="notif-bar" class="notif-container">
        <i id="notif-icon" class="fas fa-info-circle"></i>
        <div id="notif-msg" style="font-size: 14px;">Sako na zuwa...</div>
    </div>

    <div id="img-modal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modal-img">
    </div>

    <header>
        <i class="fas fa-bars icon-btn" onclick="toggleMenu(true)"></i>
        <img src="https://i.imgur.com/WeJt7D6.png" class="header-logo" alt="Logo">
        <i class="fas fa-cloud-download-alt icon-btn" onclick="installApp()"></i>
    </header>

    <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu(false)"></div>
    <nav id="side-menu">
        <i class="fas fa-times close-menu" onclick="toggleMenu(false)"></i>
        <ul class="menu-list">
            <li><a href="about.html"><i class="fas fa-users"></i> About Us</a></li>
            <li><a href="contact.html"><i class="fas fa-paper-plane"></i> Buy Post</a></li>
            
            <li onclick="logout()"><a href="#" style="color: #f87171;"><i class="fas fa-power-off"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="info-card">
        <div class="user-meta">
            <img id="user-pfp" src="" class="user-img">
            <div>
                <p style="font-size: 11px; color: #94a3b8;">Sannu da zuwa,</p>
                <b id="user-name" style="font-size: 15px;">...</b>
            </div>
        </div>
        
         <i class="fas fa-bell icon-btn" style="font-size: 18px;"></i>
    </div>
    
        <div class="status-strip">
    <div id="wasani-stat" class="stat-tag">Sports: --</div>
    <div id="news-stat" class="stat-tag">News: --</div>
    
    <div class="remain-tag">
        <span id="remain-val">0</span>
        <span>REMAIN</span>
    </div> 
</div>
                
      
   
    <div id="posts-container"></div>

    <div id="notif-permission-card">
    <p>Sakonmu yana da muhimmanci, amince domin samun sanarwa da zarar mun dora sako.</p>
    <button class="btn-allow" onclick="requestNotificationPermission()">Amince Yanzu</button>
</div>

  <script type="module">
    import { app } from './firebase.js';
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

    const auth = getAuth(app);
    const db = getDatabase(app);
    let deferredPrompt;
    const installBtn = document.querySelector('.fa-cloud-download-alt');

  
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "index.html";
        } else {
            fetchUserData(user.uid);
        }
    });

  
    function fetchUserData(uid) {
        onValue(ref(db, `users/${uid}`), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            document.getElementById('user-name').innerText = data.tvName;
            document.getElementById('user-pfp').src = data.logoImage;
            document.getElementById('remain-val').innerText = data.remain;

            updateStatus('wasani-stat', 'Wasani', data.Wasanin);
            updateStatus('news-stat', 'News', data.getPost);

            if (data.remain <= 0) {
                showNotif("Post dinka ya kare! Tuntubi CEO Albayan Media.", true);
            }

            loadPosts(uid);
            document.getElementById('loader').style.display = 'none';
        });
    }

   
   
  function loadPosts(uid) {
    onValue(ref(db, `users/${uid}/Posting`), (snapshot) => {
        const container = document.getElementById('posts-container');
        container.innerHTML = "";
        const data = snapshot.val();

        if (!data) return;

        const pids = Object.keys(data).reverse();
        
       
        const latestId = pids[0];
        const latestPost = data[latestId];
        triggerNewPostAlert(latestId, latestPost);

     
        pids.forEach(pid => {
            const post = data[pid];
            const pDate = new Date(post.postTime);

            
            if ((new Date() - pDate) / (1000 * 60 * 60 * 24) > 5) {
                remove(ref(db, `users/${uid}/Posting/${pid}`));
                return;
            }

            renderCard(pid, post, container);
        });
    });
}

function triggerNewPostAlert(pid, post) {
    const lastNotified = localStorage.getItem('last_notified_id');
    if (lastNotified === pid) return;
    localStorage.setItem('last_notified_id', pid);

  
    playAlarm();

    
    if ("Notification" in window) { 
        if (Notification.permission === "granted") {
            const notification = new Notification("Albayan Media", {
                body: "An dora sabon sako: " + (post.videoTest || "Duba sabon labari"),
                icon: "https://i.imgur.com/D96clzc.jpeg",
                badge: "https://i.imgur.com/D96clzc.jpeg",
                vibrate: [200, 100, 200]
            });
            notification.onclick = function() { window.focus(); this.close(); };
        } else {
            showNotif("Sabon Sako: " + (post.videoTest || "Duba yanzu!"));
        }
    } else {
       
        showNotif("Sabon Sako: " + (post.videoTest || "Duba yanzu!"));
    }
}


window.toggleStatus = (type, currentVal) => {
    const user = auth.currentUser;
    if (!user) return;
    
    const newVal = currentVal === 'on' ? 'off' : 'on';
    const updates = {};
    
    if (type === 'wasani') {
        updates[`users/${user.uid}/Wasanin`] = newVal;
    } else {
        updates[`users/${user.uid}/getPost`] = newVal;
    }
    
    update(ref(db), updates).then(() => {
        showNotif(`${type === 'wasani' ? 'Wasani' : 'News'} ya koma ${newVal.toUpperCase()}`);
    });
};


function updateStatus(id, label, val) {
    const el = document.getElementById(id);
    if (el) {
        el.innerHTML = `${label}: <span class="${val === 'on' ? 'on' : 'off'}">${val.toUpperCase()}</span>`;
        el.onclick = () => toggleStatus(id === 'wasani-stat' ? 'wasani' : 'news', val);
    }
}

window.requestNotificationPermission = () => {
    if (!("Notification" in window)) {
        showNotif("Browser dinka ba ta goyon bayan sanarwa.");
        return;
    }

    Notification.requestPermission().then(permission => {
        if (permission === "granted") {
            const card = document.getElementById('notif-permission-card');
            if(card) card.style.display = 'none';
            showNotif("Godiya gareku! Kun kunna sanarwa.");
            playAlarm();
        }
    });
};

function playAlarm() {
    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audio.play();
}


function checkNewPost(uid, post) {
    const lastSeenPost = localStorage.getItem('last_post_id');
    if (lastSeenPost !== post.id && Notification.permission === "granted") {
        new Notification("Albayan Media", {
            body: "An dora sabon sako: " + (post.videoTest || "Duba abun da aka dora"),
            icon: "https://i.imgur.com/D96clzc.jpeg"
        });
        playAlarm();
        localStorage.setItem('last_post_id', post.id);
    }
}


if ("Notification" in window && Notification.permission === "default") {
    setTimeout(() => {
        const card = document.getElementById('notif-permission-card');
        if(card) card.style.display = 'block';
    }, 3000);
}

  function renderCard(pid, post, container) {
    const card = document.createElement('div');
    card.className = 'post-card';
    const isNew = !localStorage.getItem(`seen_${pid}`);
    
   
    let fullText = post.test || '';
    let displayText = fullText;
    let readMoreHTML = '';
    
   
    if (fullText.length > 300) {
        displayText = fullText.substring(0, 300) + '...';
        readMoreHTML = `<span class="read-more-btn" id="rm-${pid}" onclick="expandText('${pid}')">Read More</span>`;
    }

    card.innerHTML = `
        ${isNew ? '<div class="new-badge">SABO</div>' : ''}
        ${post.imageLink ? `<img src="${post.imageLink}" class="post-media" onclick="openModal('${post.imageLink}')">` : ''}
        <div class="progress-box" id="pb-${pid}"><div class="progress-fill" id="pf-${pid}"></div></div>
        <div class="post-body">
            ${post.videoTest ? `<div class="post-title">${post.videoTest}</div>` : ''}
            ${post.videoLink ? `<video src="${post.videoLink}" class="post-media" controls></video>` : ''}
            <div class="post-desc" id="desc-${pid}">
                <span id="text-cont-${pid}">${displayText}</span>${readMoreHTML}
            </div>
            <div id="full-text-${pid}" style="display:none;">${fullText}</div>
        </div>
        <div class="post-actions">
            <div class="action-btn" onclick="copyText('full-text-${pid}', '${pid}')"><i class="fas fa-copy"></i> Copy</div>
            ${post.imageLink ? `<div class="action-btn" onclick="downloadAsset('${post.imageLink}', 'image', '${pid}')"><i class="fas fa-download"></i> Save</div>` : ''}
            ${post.videoLink ? `<div class="action-btn" onclick="downloadAsset('${post.videoLink}', 'video', '${pid}')"><i class="fas fa-file-download"></i> Video</div>` : ''}
        </div>
    `;
    container.appendChild(card);
}


  
    window.showNotif = (msg, persistent = false) => {
        const bar = document.getElementById('notif-bar');
        const text = document.getElementById('notif-msg');
        if (bar && text) {
            text.innerText = msg;
            bar.classList.add('active');
            if (!persistent) setTimeout(() => bar.classList.remove('active'), 4000);
        }
    };

    window.copyText = (id, pid) => {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            showNotif("An kwafi rubutu!");
            localStorage.setItem(`seen_${pid}`, 'true');
        });
    };
    
    
  
window.expandText = (pid) => {
    const fullText = document.getElementById(`full-text-${pid}`).innerHTML;
    document.getElementById(`text-cont-${pid}`).innerHTML = fullText;
    document.getElementById(`rm-${pid}`).style.display = 'none';
};

    window.downloadAsset = async (url, type, pid) => {
        const bar = document.getElementById(`pb-${pid}`);
        const fill = document.getElementById(`pf-${pid}`);
        if (bar) bar.style.display = 'block';
        try {
            const response = await fetch(url);
            const reader = response.body.getReader();
            const total = +response.headers.get('Content-Length') || 0;
            let loaded = 0;
            let chunks = [];
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total) fill.style.width = `${(loaded/total)*100}%`;
            }
            const blob = new Blob(chunks);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Albayan_${type}_${Date.now()}`;
            a.click();
            showNotif("Sauke fayil ya kammala!");
            localStorage.setItem(`seen_${pid}`, 'true');
        } catch (e) {
            showNotif("An samu matsala wajen sauke fayil!");
        } finally {
            setTimeout(() => { if(bar) bar.style.display = 'none'; }, 1000);
        }
    };

    window.toggleMenu = (open) => {
        document.getElementById('side-menu').classList.toggle('active', open);
        document.getElementById('menu-overlay').classList.toggle('active', open);
    };

    window.openModal = (url) => {
        document.getElementById('modal-img').src = url;
        document.getElementById('img-modal').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('img-modal').style.display = 'none';
    window.logout = () => signOut(auth).then(() => window.location.href = 'index.html');
  
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) {
            installBtn.style.color = "#4ade80";
            showNotif("Zaku iya sauke Albayan Media App yanzu!");
        }
    });

    window.installApp = async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                showNotif("Ana girka App...");
                if (installBtn) installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        } else {
            showNotif("Girkawa bata shirya ba, duba browser dinka.");
        }
    };

    window.addEventListener('appinstalled', () => {
        showNotif("An riga an girka App din, godiya gareku!");
        if (installBtn) installBtn.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
    }
</script>
</body>
</html>
