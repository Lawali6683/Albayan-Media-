<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Post - Coming Soon</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
         background: #0f172a;
        color:#fff;
    }

    .container{
        text-align:center;
        background: rgba(255,255,255,0.05);
        padding:40px;
        border-radius:20px;
        backdrop-filter: blur(15px);
        box-shadow:0 0 40px rgba(0,0,0,0.4);
        max-width:400px;
        width:90%;
        animation: fadeIn 1.2s ease-in-out;
    }

    .icon{
        font-size:60px;
        margin-bottom:20px;
    }

    h1{
        font-size:28px;
        margin-bottom:10px;
        letter-spacing:1px;
    }

    p{
        font-size:15px;
        opacity:0.8;
        margin-bottom:20px;
    }

    .dots span{
        animation: blink 1.5s infinite;
        font-size:22px;
    }

    .dots span:nth-child(2){
        animation-delay:0.2s;
    }

    .dots span:nth-child(3){
        animation-delay:0.4s;
    }

    @keyframes blink{
        0%, 100%{opacity:0.2;}
        50%{opacity:1;}
    }

    @keyframes fadeIn{
        from{opacity:0; transform:translateY(30px);}
        to{opacity:1; transform:translateY(0);}
    }

    @media(max-width:500px){
        h1{
            font-size:22px;
        }
    }
</style>

</head>
<body>

<div class="container">
    <div class="icon">🎬</div>
    <h1>Video Post</h1>
    <p>New video content is coming soon.</p>
    <div class="dots">
        <span>.</span>
        <span>.</span>
        <span>.</span>
    </div>
</div>

</body>
</html>
